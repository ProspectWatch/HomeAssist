name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # `next build` runs the TypeScript check itself — it needs the app
      # route tree to exist first to generate the typed-routes ambient
      # types (LayoutProps/PageProps), so a standalone `tsc --noEmit`
      # before this step would fail on those. Build is the real typecheck.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
